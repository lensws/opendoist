services:
  opendoist:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      OPENDOIST_PASSWORD: ${OPENDOIST_PASSWORD:?Set OPENDOIST_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - opendoist-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
volumes:
  opendoist-data:
