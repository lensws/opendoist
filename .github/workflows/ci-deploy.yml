name: Test and deploy

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete PR test runs, but never interrupt an active SSH deployment.
concurrency:
  group: opendoist-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate deployment scripts
        run: |
          bash -n install/install.sh
          bash -n install/smoke-test.sh
          bash -n deploy/automation/deploy.sh
          sh -n deploy/automation/ssh-command.sh
      - name: Build production image
        run: docker build --tag opendoist-ci:${{ github.sha }} .
      - name: Test inside the production image
        run: docker run --rm --network none --volume "$PWD/test:/app/test:ro" --volume "$PWD/deploy/automation:/app/deploy/automation:ro" --volume "$PWD/install:/app/install:ro" opendoist-ci:${{ github.sha }} node --test

      - name: Test Linux installer and persistence
        run: bash install/smoke-test.sh

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'beta' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://do.lensws.be' || 'https://beta.lensws.be' }}
    steps:
      - name: Deploy tested commit
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: 217.60.249.240
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/opendoist-deploy-key"
          hosts="$RUNNER_TEMP/opendoist-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "opendoist-deploy@$VPS_HOST" "$GITHUB_SHA"
