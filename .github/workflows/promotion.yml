name: Review beta before merging

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: beta-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  beta-ready:
    name: Verify beta deployment
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
      actions: read
    steps:
      - name: Require this repository's deployed beta commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const pr = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH)).pull_request;
          const repo = process.env.GITHUB_REPOSITORY;
          assert.equal(pr.head.repo.full_name, repo, 'PR must come from this repository');
          assert.equal(pr.head.ref, 'beta', 'Only beta may be merged into main');
          const api = async path => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
            assert.ok(response.ok, `GitHub API returned ${response.status}`);
            return response.json();
          };
          for (let attempt = 0; attempt < 48; attempt++) {
            const runs = await api(`/actions/workflows/ci-deploy.yml/runs?event=pull_request&head_sha=${pr.head.sha}&per_page=20`);
            const test = runs.workflow_runs.find(run => run.pull_requests.some(item => item.number === pr.number));
            if (test?.status === 'completed') assert.equal(test.conclusion, 'success', 'PR tests failed');
            const beta = await api('/branches/beta');
            assert.equal(beta.commit.sha, pr.head.sha, 'Beta changed; rerun checks for the latest PR commit');
            const [deployment] = await api('/deployments?environment=beta&per_page=1');
            if (deployment?.sha === pr.head.sha) {
              const [status] = await api(`/deployments/${deployment.id}/statuses?per_page=1`);
              if (status?.state === 'success' && test?.conclusion === 'success') {
                console.log(`Verified beta deployment: ${pr.head.sha}`);
                process.exit(0);
              }
              assert.ok(!['failure', 'error'].includes(status?.state), 'Beta deployment failed');
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('No successful beta deployment for this PR commit');
          JS

  beta-review:
    name: Beta verified and approved
    needs: beta-ready
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      actions: read
    environment:
      name: beta-review
      url: https://beta.lensws.be
    steps:
      - name: Recheck beta after owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const pr = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH)).pull_request;
          const repo = process.env.GITHUB_REPOSITORY;
          assert.equal(pr.head.repo.full_name, repo);
          assert.equal(pr.head.ref, 'beta');
          const api = async path => {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
            assert.ok(response.ok, `GitHub API returned ${response.status}`);
            return response.json();
          };
          const runs = await api(`/actions/workflows/ci-deploy.yml/runs?event=pull_request&head_sha=${pr.head.sha}&per_page=20`);
          const test = runs.workflow_runs.find(run => run.pull_requests.some(item => item.number === pr.number));
          assert.equal(test?.conclusion, 'success', 'PR tests are not successful');
          assert.equal((await api('/branches/beta')).commit.sha, pr.head.sha, 'Beta changed after review');
          const [deployment] = await api('/deployments?environment=beta&per_page=1');
          assert.equal(deployment?.sha, pr.head.sha, 'Reviewed beta is not this PR commit');
          const [status] = await api(`/deployments/${deployment.id}/statuses?per_page=1`);
          assert.equal(status?.state, 'success', 'Beta deployment is not healthy');
          console.log(`Owner approved tested beta commit ${pr.head.sha}`);
          JS

